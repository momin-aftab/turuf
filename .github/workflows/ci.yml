name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install game-engine dependencies
        run: npm ci
        working-directory: packages/game-engine

      - name: Typecheck — game-engine
        run: npm run typecheck
        working-directory: packages/game-engine

      - name: Typecheck — web
        run: npx tsc --noEmit
        working-directory: apps/web

      - name: Lint — web
        run: npm run lint
        working-directory: apps/web

      - name: Format check
        run: npm run format:check

      - name: Test — game-engine (with coverage)
        run: npm run test:coverage
        working-directory: packages/game-engine

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: packages/game-engine/coverage/

  build:
    name: Build check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Build Next.js app
        run: npm run build
        working-directory: apps/web
        env:
          # Provide dummy values for build-time env var validation
          JWT_SECRET: ci-placeholder-secret-32-chars-long
          UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
          UPSTASH_REDIS_REST_TOKEN: placeholder-token
          ABLY_API_KEY: placeholder-api-key
          NEXT_PUBLIC_ABLY_KEY: placeholder-public-key
